services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    networks:
      - internal
      - proxy

  api:
    build: ./api
    image: invosit-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kratos:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_WEBHOOK_SECRET: ${KRATOS_WEBHOOK_SECRET}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_REGION: ${STORAGE_REGION}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    networks:
      - internal
      - proxy

  sweep:
    image: invosit-api
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_REGION: ${STORAGE_REGION}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        export -p > /app/cron.env
        echo '0 3 * * * . /app/cron.env; /app/sweep >> /proc/1/fd/1 2>&1' > /etc/crontabs/root
        exec crond -f -d 8
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KRATOS_DB_PASSWORD: ${KRATOS_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kratos:
    image: oryd/kratos:v1.3.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://kratos:${KRATOS_DB_PASSWORD}@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
      SECRETS_DEFAULT: ${KRATOS_DEFAULT_SECRET}
      SECRETS_COOKIE: ${KRATOS_COOKIE_SECRET}
      SECRETS_CIPHER: ${KRATOS_CIPHER_SECRET}
      LOG_LEVEL: info
      SERVE_PUBLIC_BASE_URL: ${INVOSIT_BASE_URL}/kratos/
      SELFSERVICE_FLOWS_REGISTRATION_AFTER_PASSWORD_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE: ${KRATOS_WEBHOOK_SECRET}
      SELFSERVICE_FLOWS_REGISTRATION_AFTER_OIDC_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE: ${KRATOS_WEBHOOK_SECRET}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_ID: ${GITHUB_CLIENT_ID}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SERVE_PUBLIC_CORS_ALLOWED_ORIGINS_0: ${INVOSIT_BASE_URL}
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${INVOSIT_BASE_URL}/
      SELFSERVICE_ALLOWED_RETURN_URLS_0: ${INVOSIT_BASE_URL}
      SELFSERVICE_FLOWS_ERROR_UI_URL: ${INVOSIT_BASE_URL}/error
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: ${INVOSIT_BASE_URL}/settings
      SELFSERVICE_FLOWS_LOGIN_UI_URL: ${INVOSIT_BASE_URL}/login
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: ${INVOSIT_BASE_URL}/registration
      SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: ${INVOSIT_BASE_URL}/
      SESSION_COOKIE_DOMAIN: ${INVOSIT_DOMAIN}
    volumes:
      - ./api/kratos:/etc/config/kratos:ro
    networks:
      - internal
      - proxy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        kratos migrate sql -e --yes --config /etc/config/kratos/kratos.yml &&
        exec kratos serve --config /etc/config/kratos/kratos.yml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4434/admin/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  internal:
  proxy:
    external: true

volumes:
  postgres_data:
  redis_data:
