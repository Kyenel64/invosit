name: Feature request
description: Suggest a new feature or improvement
labels: ["Feature"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Invosit would this affect?
      options:
        - api
        - cli
        - frontend
        - documentation
        - infra
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What's the motivation?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? How should it work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — other approaches you thought about.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional — mockups, links, related issues.
    validations:
      required: false
